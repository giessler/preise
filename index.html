<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Preise">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<title>Preisspeicher</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b1d21;--mu:#6b7280;--ac:#e2001a;--ok:#16a34a;--bd:#e3e5e9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121316;--card:#1d1f24;--tx:#eef0f3;--mu:#9aa1ad;--bd:#2c2f36;--ok:#4ade80}}
:root[data-theme="dark"]{--bg:#121316;--card:#1d1f24;--tx:#eef0f3;--mu:#9aa1ad;--bd:#2c2f36;--ok:#4ade80}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;padding:14px;max-width:560px;margin:0 auto}
h1{font-size:22px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
input,button,select{font:inherit;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:11px;width:100%}
input{margin-bottom:8px}
button{background:var(--ac);color:#fff;border:0;font-weight:600;cursor:pointer}
button.sec{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.row{display:flex;gap:8px}.row>*{flex:1}
.row .w{flex:0 0 auto;width:auto}
.mu{color:var(--mu);font-size:14px}
.best{color:var(--ok);font-weight:700}
.item{padding:10px 0;border-top:1px solid var(--bd);cursor:pointer}
.item:first-child{border-top:0}
.top{display:flex;justify-content:space-between;gap:8px}
.pr{white-space:nowrap;font-weight:700}
#cam{position:fixed;inset:0;background:#000;z-index:9;display:none;flex-direction:column}
#cam video{flex:1;width:100%;object-fit:cover;min-height:0}
#cam .bar{padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));color:#fff;text-align:center}
textarea{width:100%;height:110px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:8px;font:12px monospace}
.hl{border:3px solid var(--ac);box-shadow:0 0 0 4px rgba(226,0,26,.18);animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.96);opacity:.4}100%{transform:scale(1);opacity:1}}
.banner{background:#15803d;color:#fff;border-radius:12px;padding:14px;margin:10px 0;text-align:center}
.banner .big{font-size:38px;font-weight:800;line-height:1.1}
.banner .sm{font-size:15px;opacity:.95;margin-top:4px}
.banner.new{background:#b45309}
.pname{font-size:20px;font-weight:800}
.del{background:none;color:var(--mu);border:0;width:auto;padding:4px 8px;font-weight:400}
</style>
</head>
<body>
<h1>🛒 Preisspeicher</h1>

<div class="card">
  <button id="scan">📷 Strichcode scannen (live)</button>
  <button class="sec" id="photo" style="margin-top:8px">📸 Foto vom Strichcode</button>
  <input type="file" id="pf" accept="image/*" capture="environment" style="display:none">
  <div class="mu" style="margin:8px 0">oder Nummer eintippen / Produkt suchen:</div>
  <input id="q" inputmode="search" placeholder="Strichcode oder Produktname" autocomplete="off">
  <button class="sec" id="go">Suchen / Neu anlegen</button>
</div>

<div class="card" id="detail" style="display:none"></div>

<div class="card">
  <div class="top"><b>Gespeicherte Produkte</b><span class="mu" id="cnt"></span></div>
  <div id="list"></div>
</div>

<div class="card">
  <b>Backup</b>
  <p class="mu">Deine Daten liegen nur in diesem Browser. Kopiere sie regelmäßig und füge sie bei Bedarf wieder ein.</p>
  <div class="row"><button class="sec" id="exp">Daten kopieren</button><button class="sec" id="imp">Daten einfügen</button></div>
  <textarea id="bk" style="display:none;margin-top:8px" placeholder="Hier Backup einfügen und nochmal auf „Daten einfügen“ tippen"></textarea>
</div>

<p class="mu" id="ver" style="text-align:center;margin:4px 0 16px"></p>

<div id="cam"><video id="vid" playsinline muted></video><div class="bar"><div id="camMsg" style="margin-bottom:10px">Strichcode ins Bild halten …</div><button class="sec" id="stop">Abbrechen</button></div></div>

<script src="zxing.min.js"></script>
<script>
var KEY='preisspeicher_v1',db={},current=null,reader=null;
function load(){try{db=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){db={}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Speichern nicht möglich.')}}
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function eur(n){return n.toFixed(2).replace('.',',')+' €'}
function best(p){var b=null;p.prices.forEach(function(x){if(!b||x.price<b.price)b=x});return b}
function keyOf(s){s=s.trim();return /^\d{6,}$/.test(s)?s:'n:'+s.toLowerCase()}

function renderList(){
  var ks=Object.keys(db).sort(function(a,b){return db[a].name.localeCompare(db[b].name)});
  $('cnt').textContent=ks.length+' Artikel';
  $('list').innerHTML=ks.length?ks.map(function(k){var p=db[k],b=best(p);
    return '<div class="item" data-k="'+esc(k)+'"><div class="top"><span>'+esc(p.name)+'</span><span class="pr best">'+eur(b.price)+'</span></div><div class="mu">'+esc(b.store)+(p.prices.length>1?' · '+p.prices.length+' Preise':'')+'</div></div>'}).join(''):'<p class="mu">Noch nichts gespeichert.</p>';
}

function open(k,name){
  current=k;var p=db[k],h='';
  var stores=[];Object.keys(db).forEach(function(x){db[x].prices.forEach(function(e){if(stores.indexOf(e.store)<0)stores.push(e.store)})});
  if(stores.indexOf('Kaufland')<0)stores.unshift('Kaufland');
  if(p){var b=best(p);
    h+='<div class="pname">'+esc(p.name)+'</div><div class="mu">'+(k.indexOf('n:')===0?'ohne Strichcode':k)+'</div>';
    h+='<div class="banner"><div class="sm">Günstigster Preis</div><div class="big">'+eur(b.price)+'</div><div class="sm">bei '+esc(b.store)+' · '+b.date+'</div></div>';
    h+=p.prices.slice().sort(function(a,b){return a.price-b.price}).map(function(e){var i=p.prices.indexOf(e);
      return '<div class="top mu"><span>'+esc(e.store)+' · '+e.date+'</span><span>'+eur(e.price)+' <button class="del" data-d="'+i+'">✕</button></span></div>'}).join('');
    h+='<hr style="border:0;border-top:1px solid var(--bd);margin:12px 0"><b>Neuen Preis eintragen</b><div style="height:8px"></div>';
  }else{
    h+='<div class="banner new"><div class="big" style="font-size:24px">Neues Produkt</div><div class="sm">'+(k.indexOf('n:')===0?'ohne Strichcode':'Strichcode '+k)+'</div></div>';
    h+='<input id="fn" placeholder="Produktname" value="'+esc(name||'')+'"><div class="mu" id="fhint" style="margin:-4px 0 8px"></div>';
    if(/^\d{6,}$/.test(k))h+='<button class="sec" id="eanweb" style="margin-bottom:8px">🔎 Auf ean-suche.de nachschlagen</button>';
  }
  h+='<div class="row"><input id="fp" inputmode="decimal" placeholder="Preis, z. B. 1,29"><input id="fs" list="sl" placeholder="Laden" value="Kaufland"></div>';
  h+='<datalist id="sl">'+stores.map(function(s){return '<option value="'+esc(s)+'">'}).join('')+'</datalist>';
  h+='<button id="sv">Preis speichern</button>';
  if(p)h+='<button class="sec" id="rm" style="margin-top:8px">Produkt löschen</button>';
  var d=$('detail');d.innerHTML=h;d.style.display='block';d.classList.remove('hl');void d.offsetWidth;d.classList.add('hl');d.scrollIntoView({behavior:'smooth'});
  if(!p&&/^\d{6,}$/.test(k))fetchName(k);
}

function fetchName(code){
  var hosts=['world.openfoodfacts.org','world.openpetfoodfacts.org','world.openproductsfacts.org','world.openbeautyfacts.org'],i=0;
  function hint(t){var h=$('fhint');if(h&&current===code)h.textContent=t}
  hint('Suche Produktname im Internet …');
  if(navigator.onLine===false)return hint('Kein Internet. Bitte Namen selbst eintippen.');
  (function next(){
    if(i>=hosts.length)return hint('Nicht in der Datenbank gefunden. Bitte Namen eintippen.');
    var ctrl=new AbortController(),t=setTimeout(function(){ctrl.abort()},6000);
    fetch('https://'+hosts[i++]+'/api/v2/product/'+code+'.json?fields=product_name,product_name_de,brands,quantity',{signal:ctrl.signal})
    .then(function(r){return r.json().catch(function(){return null})})
    .then(function(d){
      clearTimeout(t);
      var p=d&&d.status===1&&d.product,n=p&&(p.product_name_de||p.product_name);
      if(!n)return next();
      var b=(p.brands||'').split(',')[0].trim();
      if(b&&n.toLowerCase().indexOf(b.toLowerCase())<0)n=b+' '+n;
      if(p.quantity&&n.toLowerCase().indexOf(p.quantity.toLowerCase())<0)n+=' '+p.quantity;
      var f=$('fn');
      if(f&&current===code){if(!f.value.trim())f.value=n;hint('Name aus dem Internet geladen. Bitte kurz prüfen.')}
    })
    .catch(function(){clearTimeout(t);hint('Kein Internet oder keine Antwort. Bitte Namen selbst eintippen.')});
  })();
}

function lookup(txt){
  txt=txt.trim();if(!txt)return;
  var k=keyOf(txt);
  if(db[k])return open(k);
  if(k.indexOf('n:')===0){
    var m=Object.keys(db).filter(function(x){return db[x].name.toLowerCase().indexOf(txt.toLowerCase())>=0});
    if(m.length===1)return open(m[0]);
    if(m.length>1){$('list').innerHTML=m.map(function(x){var p=db[x],b=best(p);return '<div class="item" data-k="'+esc(x)+'"><div class="top"><span>'+esc(p.name)+'</span><span class="pr best">'+eur(b.price)+'</span></div><div class="mu">'+esc(b.store)+'</div></div>'}).join('');$('cnt').textContent=m.length+' Treffer';return}
    return open(k,txt);
  }
  open(k);
}

$('go').onclick=function(){lookup($('q').value)};
$('q').onkeydown=function(e){if(e.key==='Enter')lookup(this.value)};
$('list').onclick=function(e){var t=e.target.closest('.item');if(t)open(t.getAttribute('data-k'))};
$('detail').onclick=function(e){
  var t=e.target;
  if(t.id==='eanweb'){
    var h=$('fhint');if(h)h.textContent='ean-suche.de ist geöffnet. Danach hierher zurückkehren und den Namen eintippen.';
    window.open('https://www.ean-suche.de/?q='+encodeURIComponent(current),'_blank');return;
  }
  if(t.id==='sv'){
    var pr=parseFloat(($('fp').value||'').replace(',','.'));
    if(!(pr>0))return alert('Bitte einen Preis eingeben.');
    var st=($('fs').value||'').trim()||'Unbekannt';
    if(!db[current]){var nm=($('fn').value||'').trim();if(!nm)return alert('Bitte einen Produktnamen eingeben.');db[current]={name:nm,prices:[]}}
    db[current].prices.push({store:st,price:pr,date:new Date().toLocaleDateString('de-DE')});
    save();renderList();open(current);
  }
  if(t.getAttribute('data-d')!==null){db[current].prices.splice(+t.getAttribute('data-d'),1);if(!db[current].prices.length)delete db[current];save();renderList();if(db[current])open(current);else $('detail').style.display='none'}
  if(t.id==='rm'&&confirm('Produkt wirklich löschen?')){delete db[current];save();renderList();$('detail').style.display='none'}
};

function stopScan(){try{if(reader)reader.reset()}catch(e){}$('cam').style.display='none'}
$('stop').onclick=stopScan;
$('scan').onclick=function(){
  if(!window.ZXing||!navigator.mediaDevices){return alert('Scannen geht hier nicht. Bitte die Nummer eintippen.')}
  $('cam').style.display='flex';$('camMsg').textContent='Strichcode ins Bild halten …';
  var hints=new Map();hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.UPC_A,ZXing.BarcodeFormat.UPC_E]);
  reader=new ZXing.BrowserMultiFormatReader(hints);
  reader.decodeFromConstraints({video:{facingMode:'environment'}},'vid',function(res){
    if(res){var c=res.getText();stopScan();$('q').value=c;lookup(c);if(navigator.vibrate)navigator.vibrate(60)}
  }).catch(function(){$('camMsg').textContent='Live-Kamera gesperrt. Tippe auf Abbrechen und nutze „Foto vom Strichcode“.'});
};

$('photo').onclick=function(){$('pf').value='';$('pf').click()};
$('pf').onchange=function(){
  var f=this.files&&this.files[0];if(!f)return;
  if(!window.ZXing)return alert('Scan-Bibliothek nicht geladen. Bitte Nummer eintippen.');
  var url=URL.createObjectURL(f);
  var hints=new Map();hints.set(ZXing.DecodeHintType.TRY_HARDER,true);
  var r=new ZXing.BrowserMultiFormatReader(hints);
  $('photo').textContent='Lese Strichcode …';
  r.decodeFromImageUrl(url).then(function(res){
    $('photo').textContent='📸 Foto vom Strichcode';
    var c=res.getText();$('q').value=c;lookup(c);
  }).catch(function(){
    $('photo').textContent='📸 Foto vom Strichcode';
    alert('Strichcode nicht erkannt. Näher ran, besser beleuchten und nochmal versuchen, oder Nummer eintippen.');
  });
};
$('exp').onclick=function(){
  var t=JSON.stringify(db),b=$('bk');b.style.display='block';b.value=t;b.select();
  if(navigator.clipboard)navigator.clipboard.writeText(t).then(function(){$('exp').textContent='Kopiert ✓'},function(){});
};
$('imp').onclick=function(){
  var b=$('bk');
  if(b.style.display==='none'||!b.value.trim()){b.style.display='block';b.value='';b.focus();return}
  try{var d=JSON.parse(b.value);if(typeof d!=='object')throw 0;if(!confirm('Gespeicherte Daten durch das Backup ersetzen?'))return;db=d;save();renderList();$('detail').style.display='none';b.value='';b.style.display='none';alert('Backup geladen.')}catch(e){alert('Das sieht nicht nach einem gültigen Backup aus.')}
};

if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}
var VERSION='v7',BUILD='13.10.2026';
$('ver').textContent='Version '+VERSION+' · '+BUILD;
if(window.caches)caches.keys().then(function(k){var c=k.filter(function(x){return x.indexOf('preise-')===0})[0];if(c)$('ver').textContent+=' · Speicher '+c.replace('preise-','')}).catch(function(){});
load();renderList();
</script>
</body>
</html>
